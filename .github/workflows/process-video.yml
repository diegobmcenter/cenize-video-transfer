name: Process Cenize Video

on:
  push:
    paths:
      - '.github/workflows/process-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg

      - name: Download encrypted release asset
        run: |
          curl -L --fail --retry 3 \
            'https://github.com/diegobmcenter/cenize-video-transfer/releases/download/videos-001/01-Ordem-de-Servico.7z' \
            -o cenize-video.7z

      - name: Extract encrypted archive
        env:
          VIDEO_PASSWORD: ${{ secrets.VIDEO_PASSWORD }}
        run: |
          mkdir -p extracted
          7z x -y -p"$VIDEO_PASSWORD" -oextracted cenize-video.7z
          find extracted -maxdepth 3 -type f -printf '%p\n'

      - name: Build analysis package
        run: |
          set -e

          VIDEO="$(find extracted -type f \( \
            -iname '*.mp4' -o \
            -iname '*.mkv' -o \
            -iname '*.mov' -o \
            -iname '*.avi' -o \
            -iname '*.webm' \
          \) | head -n 1)"

          if [ -z "$VIDEO" ]; then
            echo "No video file found after extraction." >&2
            exit 1
          fi

          mkdir -p analysis/frames analysis/scenes

          ffprobe -v error \
            -show_format \
            -show_streams \
            "$VIDEO" > analysis/metadata.txt

          ffmpeg -hide_banner -loglevel error \
            -i "$VIDEO" \
            -vf "fps=1,scale='min(1280,iw)':-2" \
            -q:v 4 \
            analysis/frames/frame_%06d.jpg

          ffmpeg -hide_banner -loglevel error \
            -i "$VIDEO" \
            -vf "select='gt(scene,0.08)',scale='min(1280,iw)':-2" \
            -vsync vfr \
            -q:v 3 \
            analysis/scenes/scene_%06d.jpg || true

          ffmpeg -hide_banner -loglevel error \
            -i "$VIDEO" \
            -vn \
            -codec:a libmp3lame \
            -b:a 64k \
            analysis/audio.mp3 || true

          printf 'Source: %s\n' "$VIDEO" > analysis/README.txt
          printf 'Frames: 1 per second\nScene threshold: 0.08\n' >> analysis/README.txt

          du -sh analysis

      - name: Upload temporary analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: cenize-os-analysis
          path: analysis/
          retention-days: 1
          compression-level: 6
