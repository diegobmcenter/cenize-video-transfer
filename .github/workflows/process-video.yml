name: Process Cenize Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg jq

      - name: Find latest Cenize video
        id: video
        run: |
          API="https://api.github.com/repos/diegobmcenter/cenize-video-transfer/releases/tags/videos-001"

          curl -L --fail "$API" -o release.json

          ASSET_URL=$(jq -r '
            [.assets[] | select(.name | endswith(".7z"))]
            | sort_by(.created_at)
            | last
            | .browser_download_url
          ' release.json)

          ASSET_NAME=$(jq -r '
            [.assets[] | select(.name | endswith(".7z"))]
            | sort_by(.created_at)
            | last
            | .name
          ' release.json)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Nenhum arquivo .7z encontrado na Release." >&2
            exit 1
          fi

          echo "Arquivo encontrado: $ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

          curl -L --fail --retry 3 \
            "$ASSET_URL" \
            -o cenize-video.7z

      - name: Extract encrypted archive
        env:
          VIDEO_PASSWORD: ${{ secrets.VIDEO_PASSWORD }}
        run: |
          mkdir -p extracted
          7z x -y -p"$VIDEO_PASSWORD" -oextracted cenize-video.7z
          find extracted -maxdepth 3 -type f -printf '%p\n'

      - name: Build analysis package
        run: |
          set -e

          VIDEO="$(find extracted -type f \( \
            -iname '*.mp4' -o \
            -iname '*.mkv' -o \
            -iname '*.mov' -o \
            -iname '*.avi' -o \
            -iname '*.webm' \
          \) | head -n 1)"

          if [ -z "$VIDEO" ]; then
            echo "Nenhum vídeo encontrado." >&2
            exit 1
          fi

          mkdir -p analysis/frames analysis/scenes

          ffprobe -v error \
            -show_format \
            -show_streams \
            "$VIDEO" > analysis/metadata.txt

          ffmpeg -hide_banner -loglevel error \
            -i "$VIDEO" \
            -vf "fps=1,scale='min(1280,iw)':-2" \
            -q:v 4 \
            analysis/frames/frame_%06d.jpg

          ffmpeg -hide_banner -loglevel error \
            -i "$VIDEO" \
            -vf "select='gt(scene,0.08)',scale='min(1280,iw)':-2" \
            -vsync vfr \
            -q:v 3 \
            analysis/scenes/scene_%06d.jpg || true

          ffmpeg -hide_banner -loglevel error \
            -i "$VIDEO" \
            -vn \
            -codec:a libmp3lame \
            -b:a 64k \
            analysis/audio.mp3 || true

          printf 'Arquivo: %s\n' "${{ steps.video.outputs.asset_name }}" \
            > analysis/README.txt

          printf 'Frames: 1 por segundo\nScene threshold: 0.08\n' \
            >> analysis/README.txt

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: cenize-video-analysis
          path: analysis/
          retention-days: 1
          compression-level: 6
